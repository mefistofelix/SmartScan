name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # A fixed debug key (PKCS12, alias androiddebugkey, password android), so every CI build
      # installs over the previous one. app/build.gradle.kts picks it up from SMARTSCAN_DEBUG_KEYSTORE.
      # Without the secret, a random key is used per run and updates fail with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      - name: Use shared debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/smartscan-debug.p12"
            echo "SMARTSCAN_DEBUG_KEYSTORE=$RUNNER_TEMP/smartscan-debug.p12" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Print signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - name: Rename APK
        run: |
          NAME="smartscan-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: smartscan-apk
          path: ${{ env.APK_NAME }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
